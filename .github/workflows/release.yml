name: Release

# A v* tag is the release. blairham/.github's go-release.yml runs GoReleaser,
# which publishes the ghorg archives and Homebrew formula, pushes
# ghcr.io/blairham/ghorg (amd64, arm64, arm/v7), signs checksums.txt and the
# image with keyless cosign, and attests build provenance for the archives
# and the image. The notes are the tag's CHANGELOG.md section. The signing
# identity is go-release.yml itself; SECURITY.md shows how to verify it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.6). Must already exist. Leave empty for a dry run."
        required: false
        type: string
      dry-run:
        description: "Build with GoReleaser --snapshot; publish, sign and attest nothing."
        required: false
        type: boolean
        default: false

# Read-only by default; the release job asks for exactly what it writes.
permissions:
  contents: read

jobs:
  release:
    name: Release
    permissions:
      contents: write # the GitHub release and its assets
      packages: write # the image on ghcr.io
      id-token: write # keyless cosign and provenance signing
      attestations: write # store the provenance in the repository's attestations
    uses: blairham/.github/.github/workflows/go-release.yml@48d6c8f94aa8381c550818e0a0b2a0d61f280a6b # v0.0.2
    with:
      tag: ${{ inputs.tag }}
      snapshot: ${{ inputs.dry-run == true }}
      images: '["ghcr.io/blairham/ghorg"]'
      # The git tests make real commits; see ci.yml.
      test-command: >-
        git config --global user.name "Test User" &&
        git config --global user.email "test@example.com" &&
        git config --global init.defaultBranch main &&
        go test -race ./...
    secrets:
      # A token with contents:write on blairham/homebrew-tap.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
