name: CI

# Everything that gates a merge. Pre-commit, Detect changed files, Build and
# test and Fuzz are blairham/.github's go-ci.yml, and the Dockerfile check is
# its go-image.yml; their checks report as `CI / <job>` and
# `Image / Build image`. Windows is this repository's own job: go-ci.yml runs
# its commands with bash, and the Windows runner wants a config file and
# autocrlf off first. It `needs: ci` and gates its steps on
# `needs.ci.outputs.code == 'true'` (never a job-level `if:` or a `paths:`
# filter: a required check that never runs is pending forever).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    # A squash merge lands a tree no pull request built, so main gets its own run.
    branches: [main]
  schedule:
    # Weekly, for go-ci.yml's Fuzz job, which explores on main and on this
    # schedule but never on a pull request.
    - cron: '23 5 * * 3'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: blairham/.github/.github/workflows/go-ci.yml@48d6c8f94aa8381c550818e0a0b2a0d61f280a6b # v0.0.2
    with:
      os: '["ubuntu-latest", "macos-latest"]'
      # The git tests make real commits, so the runner needs an identity and
      # a default branch name before they start.
      test-command: >-
        git config --global user.name "Test User" &&
        git config --global user.email "test@example.com" &&
        git config --global init.defaultBranch main &&
        go test -race ./...

  # Build only; a v* tag publishes (release.yml). The `ghorg` stage compiles
  # from source; the release stage copies GoReleaser's binary instead.
  image:
    name: Image
    needs: ci
    uses: blairham/.github/.github/workflows/go-image.yml@48d6c8f94aa8381c550818e0a0b2a0d61f280a6b # v0.0.2
    with:
      run: ${{ needs.ci.outputs.code == 'true' }}
      targets: '["ghorg"]'
      platforms: linux/amd64,linux/arm64,linux/arm/v7

  test-windows:
    name: Build and test (windows-latest)
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.ci.outputs.code == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.ci.outputs.code == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Set configuration file
        if: needs.ci.outputs.code == 'true'
        run: |
          mkdir C:\Users\runneradmin\.config\ghorg
          copy sample-conf.yaml C:\Users\runneradmin\.config\ghorg\conf.yaml
      - name: Configure Git for tests
        if: needs.ci.outputs.code == 'true'
        run: |
          git config --global user.name "Test User"
          git config --global user.email "test@example.com"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
      - name: Test
        if: needs.ci.outputs.code == 'true'
        run: go test -race ./...
