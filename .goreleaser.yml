# GoReleaser builds and publishes the ghorg archives, the Homebrew formula and
# the ghcr.io/blairham/ghorg image. It runs inside blairham/.github's
# go-release.yml (see .github/workflows/release.yml), which also attests build
# provenance for the archives and the image.
version: 2
project_name: ghorg
before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    main: .
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/blairham/ghorg/internal/cmd.version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
archives:
  - id: ghorg
    name_template: >-
      {{- .ProjectName }}_ {{- .Version }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else if eq .Arch "386" }}i386 {{- else }}{{ .Arch }}{{ end }} {{- if .Arm }}v{{ .Arm }}{{ end -}}

# A formula, not a cask. ghorg is a CLI binary with no bundle, no installer and
# no service; `brew services` and `brew test` are worth keeping, and formulae
# work on Homebrew for Linux exactly as they do on macOS.
#
# GoReleaser marks `brews` deprecated in favor of `homebrew_casks`, on the
# grounds that formulae installing pre-compiled binaries are "hackyish" and
# were only needed because Linuxbrew could not handle casks. There is no
# announced removal date, and the Linuxbrew limitation is not our reason for
# using them.
#
# Note there is no quarantine hook here: casks flag their downloads with
# com.apple.quarantine and need it stripped, formulae do not.
brews:
  - name: ghorg
    repository:
      owner: blairham
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/blairham/ghorg
    description: Quickly clone an entire org/users repositories into one directory
    license: Apache-2.0
    install: |
      bin.install "ghorg"
    test: |
      system "#{bin}/ghorg", "version"
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true

checksum:
  name_template: "checksums.txt"

# Keyless cosign signature over checksums.txt, from the release workflow's own
# GitHub OIDC identity: no key to store or leak. Signing checksums.txt covers
# every archive, since it lists each one's digest. See SECURITY.md to verify.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

# The image, by digest.
docker_signs:
  - cmd: cosign
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"

# The release notes are the tag's CHANGELOG.md section, passed by
# go-release.yml with --release-notes, which replaces this generated list. Do
# not set `changelog.disable`: it also skips the stage that loads
# --release-notes, and the release would go out with empty notes.
changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?.*$'
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))?.*$'
    - title: Performance
      regexp: '^.*?perf(\(.+\))?.*$'
    - title: Refactoring
      regexp: '^.*?refactor(\(.+\))?.*$'
    - title: CI/CD
      regexp: '^.*?ci(\(.+\))?.*$'
    - title: Other
      order: 999

# --snapshot never builds the multi-arch index, and SBOM attestation is on by
# default, so it is turned off. `--target=release` copies this build's binary;
# the Dockerfile's default stage would compile it again.
dockers_v2:
  - images:
      - "ghcr.io/blairham/ghorg"
    dockerfile: Dockerfile
    flags:
      - --target=release
    sbom: false
    # Image tags have always carried the `v` (ghcr.io/blairham/ghorg:v0.1.5);
    # `latest` moves only on a real release, never a prerelease.
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "Quickly clone an entire org/users repositories into one directory"
      "org.opencontainers.image.url": "https://github.com/blairham/ghorg"
      "org.opencontainers.image.source": "https://github.com/blairham/ghorg"
      "org.opencontainers.image.licenses": "Apache-2.0"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
    extra_files:
      - sample-conf.yaml
      - sample-reclone.yaml
